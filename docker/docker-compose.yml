name: financial-reconciliation-lakehouse


services:
  postgres:
    image: postgres:15-alpine
    container_name: lakehouse-postgres
    restart: unless-stopped
    ports:
      - 5432:5432

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-operational_db}
      TZ: ${TZ:-UTC}

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-operational_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - lakehouse_net

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    command: ["postgres", "-c", "wal_level=logical"]  


  kafka:
    image: quay.io/debezium/kafka:3.2
    container_name: lakehouse-kafka
    restart: unless-stopped
    ports: 
      - 9092:9092
      - 9093:9093

    environment:
      - CLUSTER_ID=${KAFKA_CLUSTER_ID:-oh-sxaDRTcyAr6pFRbXyzA}
      - NODE_ID=${KAFKA_NODE_ID:-1}
      - NODE_ROLE=${KAFKA_NODE_ROLE:-combined}
      - KAFKA_CONTROLLER_QUORUM_VOTERS=${KAFKA_CONTROLLER_QUORUM_VOTERS:-1@kafka:9093}
      
      - KAFKA_LISTENERS=${KAFKA_LISTENERS:-INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093}
      - KAFKA_ADVERTISED_LISTENERS=${KAFKA_ADVERTISED_LISTENERS:-INTERNAL://kafka:29092,EXTERNAL://localhost:9092}
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=${KAFKA_LISTENER_SECURITY_PROTOCOL_MAP:-INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT}
      - KAFKA_INTER_BROKER_LISTENER_NAME=${KAFKA_INTER_BROKER_LISTENER_NAME:-INTERNAL}
    
    healthcheck:
      test: ["CMD-SHELL", "/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    networks:
      - lakehouse_net

    volumes:
      - kafka_data:/var/lib/kafka/data

  connect:
    image: quay.io/debezium/connect:3.2
    container_name: lakehouse-debezium
    restart: unless-stopped
    ports:
      - 8083:8083

    depends_on:
      kafka:
        condition: service_healthy
        
      postgres:
        condition: service_healthy
    
    networks:
      - lakehouse_net

    environment:
      - BOOTSTRAP_SERVERS=${CONNECT_BOOTSTRAP_SERVERS:-kafka:29092}
      - GROUP_ID=${CONNECT_GROUP_ID:-1}
      - CONFIG_STORAGE_TOPIC=${CONNECT_CONFIG_STORAGE_TOPIC:-my_connect_configs}
      - OFFSET_STORAGE_TOPIC=${CONNECT_OFFSET_STORAGE_TOPIC:-my_connect_offsets}
      - STATUS_STORAGE_TOPIC=${CONNECT_STATUS_STORAGE_TOPIC:-my_connect_statuses}

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/ >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  smoke-test:
    image: alpine:3.20
    container_name: lakehouse-smoke-test
    restart: "no"
    depends_on:
      connect:
        condition: service_healthy
    networks:
      - lakehouse_net
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-operational_db}
      KAFKA_HOST: kafka
      KAFKA_PORT: 29092
      CONNECT_URL: http://connect:8083
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_ENDPOINT: http://minio:9000
    volumes:
      - ./smoke-test.sh:/smoke-test.sh:ro
    entrypoint: ["/bin/sh", "/smoke-test.sh"]

  minio:
    image: minio/minio:RELEASE.2024-04-18T19-09-19Z
    container_name: lakehouse-minio
    restart: unless-stopped
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 5s
    networks:
      - lakehouse_net
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"

  mc:
    image: quay.io/minio/mc:RELEASE.2024-04-18T16-45-29Z
    container_name: lakehouse-mc
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - lakehouse_net
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        /usr/bin/mc config host add minio http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" &&
        /usr/bin/mc mb --ignore-existing minio/lakehouse-bronze &&
        /usr/bin/mc mb --ignore-existing minio/lakehouse-silver &&
        /usr/bin/mc mb --ignore-existing minio/lakehouse-gold &&
        echo "MinIO buckets created successfully"


  spark-master:
    image: bitnamilegacy/spark:3.5.1
    container_name: lakehouse-spark-master
    restart: unless-stopped
    networks:
      - lakehouse_net

    depends_on:
      minio:
        condition: service_healthy

    ports: 
      - 8080:8080
      - 7077:7077 

    environment:
      SPARK_MODE: master
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8080
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
    
    volumes:
      - ../src:/opt/bitnami/spark/src
      - ./conf/spark-defaults.conf:/opt/bitnami/spark/conf/spark-defaults.conf

    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/spark-master/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s


  spark-worker:
    image: bitnamilegacy/spark:3.5.1
    container_name: lakehouse-spark-worker
    restart: unless-stopped
    ports:
      - 8081:8081

    depends_on:
      spark-master:
        condition: service_healthy

    volumes: 
      - ../src:/opt/bitnami/spark/src
      - ./conf/spark-defaults.conf:/opt/bitnami/spark/conf/spark-defaults.conf

    networks:
      - lakehouse_net

    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_WEBUI_PORT: 8081
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"

    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/spark-worker/8081' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s


volumes:
  postgres_data:
  kafka_data:
  minio_data:

networks:
  lakehouse_net:
    driver: bridge
    name: lakehouse-network